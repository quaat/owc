name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  m1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Install Stockfish reference engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stockfish
      - name: Stockfish oracle smoke
        run: |
          STOCKFISH_PATH=/usr/games/stockfish python -m owc oracle score --fen "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1" --nodes 256 --json
      - name: Dataset generation smoke
        run: |
          ROOT="$(mktemp -d)"
          python -m owc dataset build --synthetic-games 10 --seed 42 --min-ply 4 --stride 2 --max-plies 12 --dev-dir "$ROOT/dev" --heldout-dir "$ROOT/heldout"
          test -f "$ROOT/dev/train.fen"
          test -f "$ROOT/heldout/test.fen"
          head -n 1 "$ROOT/dev/train.fen" > "$ROOT/one.fen"
          test -s "$ROOT/one.fen"
          STOCKFISH_PATH=/usr/games/stockfish python -m owc oracle batch --input "$ROOT/one.fen" --output "$ROOT/one.labels.jsonl" --nodes 128
          test -s "$ROOT/one.labels.jsonl"
          test -s "$ROOT/one.labels.jsonl.manifest.json"
      - name: Weight programming smoke
        run: |
          ROOT="$(mktemp -d)"
          python -m owc weights init --session "$ROOT/session"
          python -m owc weights checkpoint --session "$ROOT/session" --name baseline
          python -m owc weights inspect --session "$ROOT/session" --tensor layers.4.bias
          python -m owc weights probe --session "$ROOT/session" --fen "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
          python -m owc weights rollback --session "$ROOT/session" --name baseline
      - name: M3 fixture experiment and Stockfish feedback pipeline
        run: |
          ROOT="$(mktemp -d)"
          python -m owc dataset build --synthetic-games 50 --seed 42 --min-ply 4 --stride 2 --max-plies 10 --dev-dir "$ROOT/dev" --heldout-dir "$ROOT/heldout"
          STOCKFISH_PATH=/usr/games/stockfish python -m owc oracle batch --input "$ROOT/dev/dev.fen" --output "$ROOT/dev/dev.labels.jsonl" --nodes 64
          python -m owc experiment run --dev-labels "$ROOT/dev/dev.labels.jsonl" --output-dir "$ROOT/experiment" --feedback-rounds 0
      - name: CLI smoke
        run: python -m owc inspect --json
